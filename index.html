      <path d="M12 11c-1.2-3.4-4.8-4-5.8-1.6-.9 2.2 2.4 2.9 5.8 1.6 3.4 1.3 6.7.6 5.8-1.6-1-2.4-4.6-1.8-5.8 1.6z"/>

<div class="wrap">
  <div class="head">
    <span class="title">我的账本</span>
    <span class="month" id="v-month"></span>
  </div>

  <!-- budget: total summary + per-category countdown bars -->
  <section>
    <div class="sec"><span class="t">分类预算</span></div>
    <div class="bsum" id="v-bsum"></div>
    <div class="bpace" id="v-bpace" style="margin-block-start:var(--kimi-space-2)"></div>
    <div class="blist btiles" id="v-blist" style="margin-block-start:var(--kimi-space-3)"></div>
  </section>

  <!-- debts: installment loans pop up on due day; credit cards stay -->
  <section id="v-debtsec">
    <div class="sec"><span class="t">负债 · 还款</span><span style="display:inline-flex;align-items:center;gap:var(--kimi-space-2)"><span class="tot" id="v-debttot"></span><button class="link" id="b-debtmgmt"><svg><use href="#i-edit"/></svg>管理</button></span></div>
    <div class="blist" id="v-debts"></div>
  </section>

  <!-- accounts (assets only: debit / cash) -->
  <section>
    <div class="sec">
      <span class="t">我的账户</span>
      <button class="link" id="b-trf"><svg><use href="#i-swap"/></svg>转账</button>
    </div>
    <div class="accs" id="v-accs"></div>
  </section>

  <!-- recent -->
  <section>
    <div class="sec"><span class="t">最近流水</span></div>
    <div class="tx" id="v-tx"></div>
  </section>
</div>

<!-- modal -->
<div class="mask" id="v-mask">
  <div class="sheet" id="v-sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- data ---------------- */
  /* categories are fully user-defined: { id, name, icon } stored in state.cats */
  var ICON_POOL = ["i-bowl", "i-car", "i-bag", "i-home", "i-game", "i-med", "i-gift", "i-more"];
  var ACC_TYPES = {
    debit:  { name: "储蓄卡", icon: "i-card" },
    cash:   { name: "现金",   icon: "i-cash" },
    credit: { name: "信用卡", icon: "i-credit" },
    loan:   { name: "信用贷", icon: "i-loan" }
  };
  /* legacy preset ids -> display names, only used to migrate old data */
  var LEGACY_CATS = {
    food: ["餐饮", "i-bowl"], transport: ["交通加油", "i-car"], shopping: ["购物", "i-bag"],
    home: ["居家", "i-home"], fun: ["娱乐", "i-game"], health: ["医疗健康", "i-med"],
    social: ["人情社交", "i-gift"], other: ["其他", "i-more"]
  };

  function defaults() {
    return {
      cats: [],
      budgets: {},
      accounts: [
        { id: "a_icbc",  name: "工行储蓄卡", type: "debit",  balance: 0, last: null },
        { id: "a_abc",   name: "农行储蓄卡", type: "debit",  balance: 0, last: null },
        { id: "a_cash",  name: "现金",       type: "cash",   balance: 0, last: null },
        { id: "a_cc",    name: "信用卡",     type: "credit", balance: 0, last: null, dueDay: 2, limit: 7500 },
        { id: "a_meituan", name: "美团信用贷", type: "loan", balance: 0, last: null, dueDay: 15, amt: 5723.85 }
      ],
      tx: []
    };
  }
  var state = defaults();

  /* ---------------- utils ---------------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { n = Math.round(n * 100) / 100; return "¥" + n.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtS(n) { return (n > 0 ? "+" : "") + fmt(n); }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function monthKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function nowISO() { return new Date().toISOString(); }
  function parseAmt(v) { var n = parseFloat(v); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null; }
  function ico(name, cls) { return '<svg class="' + (cls || "") + '" aria-hidden="true"><use href="#' + name + '"/></svg>'; }
  function accById(id) { for (var i = 0; i < state.accounts.length; i++) if (state.accounts[i].id === id) return state.accounts[i]; return null; }
  function catById(id) {
    for (var i = 0; i < state.cats.length; i++) if (state.cats[i].id === id) return state.cats[i];
    return { id: id || "none", name: "未分类", icon: "i-more" };
  }
  function isDueAcc(a) { return a && (a.type === "credit" || a.type === "loan"); }
  /* account name + live balance for <option> labels */
  function accOptLabel(a) {
    return isDueAcc(a)
      ? esc(a.name) + "（待还 " + fmt(Math.max(0, a.balance)) + "）"
      : esc(a.name) + " · " + fmt(a.balance);
  }
  function nextIcon() {
    var best = ICON_POOL[0], bn = 1e9;
    ICON_POOL.forEach(function (ic) {
      var n = 0;
      state.cats.forEach(function (c) { if (c.icon === ic) n++; });
      if (n < bn) { bn = n; best = ic; }
    });
    return best;
  }
  function addCat(name) {
    var cat = { id: uid("c"), name: name, icon: nextIcon() };
    state.cats.push(cat);
    return cat;
  }
  /* days until due date + cycle progress (0..1 elapsed) */
  function dueInfo(a, now) {
    if (!a.dueDay) return null;
    var y = now.getFullYear(), m = now.getMonth(), dd = a.dueDay;
    var due = new Date(y, m, dd, 23, 59, 59);
    if (now.getTime() > due.getTime()) {
      return { overdue: true, days: Math.max(1, Math.floor((now.getTime() - due.getTime()) / 86400000)), past: 1 };
    }
    var prev = new Date(y, m - 1, dd);
    var past = (now.getTime() - prev.getTime()) / (due.getTime() - prev.getTime());
    return { overdue: false, days: Math.max(0, Math.ceil((due.getTime() - now.getTime()) / 86400000)), past: Math.max(0, Math.min(1, past)) };
  }
  /* next due date strictly AFTER today, as "YYYY-MM-DD" (credit-card bill anchor) */
  function nextDueKey(a, now) {
    var dd = a.dueDay || 2;
    var y = now.getFullYear(), m = now.getMonth();
    var d = new Date(y, m, dd);
    if (now.getTime() >= new Date(y, m, dd, 23, 59, 59).getTime()) d = new Date(y, m + 1, dd);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  /* keep billDue in sync with the outstanding balance of a credit card:
     balance appears -> anchor to the next due date; balance cleared -> drop anchor */
  function syncBillDue(acc) {
    if (!acc || acc.type !== "credit") return;
    if (acc.balance > 0) { if (!acc.billDue) acc.billDue = nextDueKey(acc, new Date()); }
    else acc.billDue = null;
  }

  /* ---------------- persistence ---------------- */
  function persist() {
    try { localStorage.setItem("cup-ledger-v1", JSON.stringify(state)); } catch (e) {}
  }
  /* old data (fixed preset categories) -> user-defined categories */
  function migrateCats(d) {
    var ids = [];
    var pushId = function (id) { if (id && ids.indexOf(id) < 0) ids.push(id); };
    if (d.budgets && typeof d.budgets === "object") Object.keys(d.budgets).forEach(pushId);
    if (Array.isArray(d.tx)) d.tx.forEach(function (t) { if (t && t.type === "expense") pushId(t.category); });
    return ids.map(function (id) {
      if (LEGACY_CATS[id]) return { id: id, name: LEGACY_CATS[id][0], icon: LEGACY_CATS[id][1] };
      return { id: id, name: id, icon: nextIcon() };
    });
  }
  /* one-time seed / correction of the owner's real account parameters */
  function seedAccounts() {
    state.accounts.forEach(function (a) {
      if (a.type === "credit") {
        if (!a.limit) a.limit = 7500;
        if (a.dueDay == null) a.dueDay = 2;
        /* 机主确认本期已还清：清掉预置的未还金额（不动已记的流水） */
        if (a.balance === 3824.48 && !state.tx.some(function (t) { return t.accountId === a.id; })) a.balance = 0;
        /* 旧数据没有账单锚点：未还 > 0 的锚到下一个还款日，避免误显示逾期 */
        if (a.balance > 0 && !a.billDue) a.billDue = nextDueKey(a, new Date());
        /* 负数为异常状态（历史上多扣造成）：按流水重算未还，避免被 0 掩盖 */
        if (a.balance < 0) {
          var s = 0;
          state.tx.forEach(function (t) {
            if (t.type === "expense" && t.accountId === a.id) s += t.amount;
            if (t.type === "repay" && t.toId === a.id) s -= t.amount;
          });
          a.balance = Math.max(0, r2(s));
          a.last = null;
          a.billDue = a.balance > 0 ? nextDueKey(a, new Date()) : null;
        }
      } else if (a.type === "loan") {
        /* 机主确认美团贷还款日为每月 2 号（纠正早期的 15 号默认） */
        if (a.id === "a_meituan" && a.dueDay === 15) a.dueDay = 2;
        if (!a.amt && a.balance > 0) a.amt = a.balance;
        /* 无流水的美团贷按"本期已还"处理，避免误显示逾期 */
        if (a.id === "a_meituan" && !state.tx.some(function (t) { return t.accountId === a.id || t.fromId === a.id || t.toId === a.id; })) {
          a.balance = 0;
          a.settled = monthKey(new Date());
        }
      }
    });
  }
  function load(cb) {
    var raw = null;
    try { raw = localStorage.getItem("cup-ledger-v1"); } catch (e) {}
    /* 首次使用：从看板迁移过来的账本数据 */
    if (!raw && window.__FIN_SEED__) { raw = JSON.stringify(window.__FIN_SEED__); }
    if (raw) {
      try {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.accounts)) {
          var base = defaults();
          state.budgets = (d.budgets && typeof d.budgets === "object") ? d.budgets : {};
          state.accounts = d.accounts.length ? d.accounts : base.accounts;
          state.tx = Array.isArray(d.tx) ? d.tx : [];
          state.cats = Array.isArray(d.cats) ? d.cats : migrateCats(d);
        }
      } catch (e) {}
    }
    seedAccounts();
    cb();
  }

  /* ---------------- derived ---------------- */
  function monthTx() {
    var mk = monthKey(new Date());
    return state.tx.filter(function (t) { return (t.ts || "").slice(0, 7) === mk; });
  }
  function spendByCat() {
    var m = {};
    monthTx().forEach(function (t) {
      if (t.type === "expense") m[t.category || "none"] = (m[t.category || "none"] || 0) + t.amount;
    });
    return m;
  }
  function monthSpend() {
    var m = spendByCat(), s = 0;
    Object.keys(m).forEach(function (k) { s += m[k]; });
    return s;
  }

  /* ---------------- render: budget ---------------- */
  function renderBudget() {
    var now = new Date();
    var spentMap = spendByCat();
    var totalSpend = monthSpend();
    var totalBudget = 0;
    state.cats.forEach(function (c) { totalBudget += state.budgets[c.id] || 0; });
    var totalRemain = totalBudget - totalSpend;

    /* summary card */
    $("v-bsum").innerHTML =
      '<div class="l"><span class="t">' + ico("i-wallet") + '本月还剩</span>' +
      '<span class="v num' + (totalRemain < 0 ? " neg" : "") + '">' + fmt(totalRemain) + "</span></div>" +
      '<div class="r"><span>分类预算 <b class="num">' + fmt(totalBudget) + "</b></span>" +
      '<span>本月已花 <b class="num">' + fmt(totalSpend) + "</b></span></div>";

    /* pace hint */
    var paceEl = $("v-bpace"), paceHtml = "";
    if (totalBudget > 0) {
      var dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      var spentR = totalSpend / totalBudget, elapsedR = now.getDate() / dim;
      if (totalRemain < 0) paceHtml = '<span class="kimi-status kimi-status--danger">总支出已超预算 ' + fmt(-totalRemain) + "</span>";
      else if (spentR > elapsedR * 1.15) paceHtml = '<span class="kimi-status kimi-status--warning">花钱速度偏快，注意控制</span>';
      else if (totalSpend > 0) paceHtml = '<span class="kimi-status kimi-status--positive">消费节奏良好，继续保持</span>';
    }
    paceEl.innerHTML = paceHtml;

    /* per-category tiles (量杯方块) */
    var rows = state.cats.map(function (c) {
      return { cat: c, budget: state.budgets[c.id] || 0, spent: spentMap[c.id] || 0 };
    });
    rows.sort(function (a, b) {
      if (a.budget <= 0 && b.budget > 0) return -1;
      if (a.budget > 0 && b.budget <= 0) return 1;
      if (a.budget > 0 && b.budget > 0) return (b.spent / b.budget) - (a.spent / a.budget);
      return b.spent - a.spent;
    });

    var html = "";
    if (!rows.length) {
      html = '<div class="empty">还没有消费类别。点下方「新建类别」创建你自己的分类（餐饮、加油、宠物……都可以），再记一笔支出，量杯就会亮起来。</div>';
    }
    var crack = '<svg class="crack" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g stroke="var(--kimi-color-danger)" stroke-width="1.1" opacity=".65" fill="none"><polyline points="50,44 40,32 33,20"/><polyline points="50,44 63,36 73,24"/><polyline points="50,44 62,58 71,68"/><polyline points="50,44 38,56 28,68"/><polyline points="50,44 47,62 51,80"/></g></svg>';
    rows.forEach(function (r) {
      if (r.budget <= 0) {
        html += '<div class="btile needb" tabindex="0" role="button" data-bcat="' + r.cat.id + '" aria-label="' + esc(r.cat.name) + '，设置预算">' +
          '<span class="hint">' + ico(r.cat.icon) + '点我设预算</span></div>';
        return;
      }
      var remain = r.budget - r.spent;
      var ratio = remain / r.budget;
      var over = remain < 0;
      var low = !over && ratio < 0.25;
      var fillH = over ? 100 : Math.max(0, Math.min(100, ratio * 100));
      var vCls = over ? " neg" : low ? " warn" : "";
      var pctTxt = over ? "杯碎了" : "剩 " + Math.round(ratio * 100) + "%";
      html += '<div class="btile' + (over ? " burst" : "") + '" tabindex="0" role="button" data-bcat="' + r.cat.id + '" aria-label="' + esc(r.cat.name) + '，记支出">' +
        (over ? '<span class="tag">超支</span>' + crack : "") +
        '<div class="water' + (low ? " warn" : "") + '" style="height:' + fillH.toFixed(1) + '%"></div>' +
        '<div class="in"><div class="top">' + ico(r.cat.icon) + '<span class="nm">' + esc(r.cat.name) + '</span></div>' +
        '<div class="mid"><span class="v num' + vCls + '">' + fmt(remain) + '</span><span class="pc">' + pctTxt + '</span></div>' +
        '<div class="bot num">已花 ' + fmt(r.spent) + ' / ' + fmt(r.budget) + '</div></div></div>';
    });
    html += '<button class="badd" id="b-addcat">' + ico("i-plus") + "<span>新建类别</span></button>";
    $("v-blist").innerHTML = html;
  }

  /* ---------------- render: debts ---------------- */
  /* loan (定期扣款): pops up ON the due day with 本期应还, hides once settled.
     credit (循环信用): always visible; bar = used limit %, right = DDL countdown. */
  function renderDebts() {
    var now = new Date();
    var mk = monthKey(now);
    var y = now.getFullYear(), m = now.getMonth();
    var debts = state.accounts.filter(isDueAcc);
    $("v-debtsec").style.display = debts.length ? "" : "none";
    if (!debts.length) { $("v-debts").innerHTML = ""; $("v-debttot").innerHTML = ""; return; }

    var html = "", total = 0, dirty = false;
    var browOpen = function (a, cls) {
      var t = ACC_TYPES[a.type] || ACC_TYPES.credit;
      return '<div class="brow' + cls + '" tabindex="0" role="button" data-debt="' + a.id + '" aria-label="' + esc(a.name) + '，还款">' +
        '<div class="r1"><span class="ico">' + ico(t.icon) + "</span>";
    };

    /* 定期扣款类 */
    state.accounts.filter(function (a) { return a.type === "loan"; }).forEach(function (a) {
      if (!a.dueDay) {
        html += browOpen(a, " nob") +
          '<span class="nm"><span>' + esc(a.name) + '</span><span class="sub">待还 ' + fmt(Math.max(0, a.balance)) + " · 未设还款日</span></span>" +
          '<span class="rem"><span class="rem mini">设还款日 →</span></span></div>' +
          '<div class="track"><div class="fill" style="width:0%"></div></div></div>';
        return;
      }
      var due = new Date(y, m, a.dueDay, 23, 59, 59);
      var visible = now.getTime() >= due.getTime() && a.settled !== mk;
      if (!visible) return; /* 未到还款日或本期已了结：完全隐藏 */
      if (!(a.balance > 0) && a.amt > 0) { a.balance = a.amt; dirty = true; } /* 到还款日刷新本期应还 */
      var amt = a.amt || a.balance;
      var remaining = Math.max(0, a.balance);
      total += remaining;
      var days = Math.floor((now.getTime() - due.getTime()) / 86400000);
      var statusHtml = days <= 0
        ? '<span class="num">今日扣款</span>'
        : '<span class="num neg">逾期 ' + days + " 天</span>";
      var fillCls = days > 0 ? "danger" : "";
      var fillW = amt > 0 ? Math.max(0, Math.min(100, remaining / amt * 100)) : 100;
      var sub = "本期应还 " + fmt(amt) + (remaining > 0 && remaining < amt ? " · 剩余 " + fmt(remaining) : "");
      html += browOpen(a, "") +
        '<span class="nm"><span>' + esc(a.name) + '</span><span class="sub">' + sub + "</span></span>" +
        '<span class="rem">' + statusHtml + "</span></div>" +
        '<div class="track"><div class="fill ' + fillCls + '" style="width:' + fillW.toFixed(1) + '%"></div></div></div>';
    });

    /* 循环信用类 */
    state.accounts.filter(function (a) { return a.type === "credit"; }).forEach(function (a) {
      var used = Math.max(0, a.balance);
      total += used;
      var lim = a.limit || 0;
      var pct = lim > 0 ? used / lim : 0;
      var bd = (a.dueDay && a.billDue) ? new Date(a.billDue + "T23:59:59") : null;
      var statusHtml, fillCls = "", fillW = Math.max(0, Math.min(100, pct * 100)), sub, rowCls = "";
      if (a.balance < 0) {
        statusHtml = '<span class="num neg">数据异常</span>';
        fillCls = "danger"; rowCls = " nob";
        sub = "未还被多扣成负数 · 点此条用「调整未还金额」修正";
      } else if (used <= 0) {
        statusHtml = '<span class="num ok">已结清</span>';
        fillW = 0;
        sub = (lim ? "额度 " + fmt(lim) + " · " : "") + (a.dueDay ? "DDL 每月 " + a.dueDay + " 日" : "未设还款日");
      } else if (!bd) {
        statusHtml = '<span class="rem mini">设还款日 →</span>';
        fillW = 0; rowCls = " nob";
        sub = "未还 " + fmt(used) + (lim ? " · 额度 " + fmt(lim) : "");
      } else {
        var days = Math.round((bd.getTime() - now.getTime()) / 86400000);
        if (days < 0) {
          statusHtml = '<span class="num neg">逾期 ' + (-days) + " 天</span>";
          fillCls = "danger"; rowCls = " nob";
        } else {
          statusHtml = '<span class="num' + (days <= 5 ? " warn" : "") + '">' + (days === 0 ? "今日 DDL" : "还有 " + days + " 天") + "</span>";
          fillCls = days <= 5 ? "warn" : (pct >= 1 ? "danger" : pct >= 0.8 ? "warn" : "");
        }
        sub = "未还 " + fmt(used) + (lim ? " · 已用额度 " + Math.round(pct * 100) + "%" : "") + " · DDL " + a.billDue.slice(5).replace("-", "/");
      }
      html += browOpen(a, rowCls) +
        '<span class="nm"><span>' + esc(a.name) + '</span><span class="sub">' + sub + "</span></span>" +
        '<span class="rem">' + statusHtml + "</span></div>" +
        '<div class="track"><div class="fill ' + fillCls + '" style="width:' + fillW.toFixed(1) + '%"></div></div></div>';
    });

    if (dirty) persist();
    html += '<button class="badd" id="b-adddebt">' + ico("i-plus") + "<span>添加负债</span></button>";
    $("v-debts").innerHTML = html;
    $("v-debttot").innerHTML = '共待还 <b class="num">' + fmt(total) + "</b>";
  }

  /* ---------------- render: accounts (assets only) ---------------- */
  function renderAccounts() {
    var html = "";
    state.accounts.filter(function (a) { return !isDueAcc(a); }).forEach(function (a) {
      var t = ACC_TYPES[a.type] || ACC_TYPES.debit;
      var sub = "";
      if (a.last != null && a.last !== a.balance) {
        var d = a.balance - a.last;
        sub = '较上次 <span class="' + (d > 0 ? "up" : "down") + ' num">' + fmtS(d) + "</span>";
      }
      html += '<div class="acc" tabindex="0" role="button" data-aid="' + a.id + '" aria-label="' + esc(a.name) + '，点按记收支">' +
        '<div class="acts">' +
        '<button data-act="bal" data-id="' + a.id + '" aria-label="记余额">' + ico("i-save") + "</button>" +
        '<button data-act="del" data-id="' + a.id + '" aria-label="删除账户" class="danger">' + ico("i-trash") + "</button>" +
        "</div>" +
        '<div class="top"><span class="ico">' + ico(t.icon) + '</span><span class="name">' + esc(a.name) + "</span></div>" +
        '<span class="bal num">' + fmt(a.balance) + "</span>" +
        '<span class="sub">' + sub + "</span>" +
        "</div>";
    });
    html += '<button class="acc-add" id="b-addacc">' + ico("i-plus") + "<span>添加账户</span></button>";
    $("v-accs").innerHTML = html;
  }

  /* ---------------- tx balance effects (shared by delete / edit) ---------------- */
  function r2(n) { return Math.round(n * 100) / 100; }
  function revertTx(t) {
    var acc;
    if (t.type === "expense") {
      acc = accById(t.accountId);
      if (acc) {
        if (isDueAcc(acc)) acc.balance = r2(acc.balance - t.amount);
        else acc.balance = r2(acc.balance + t.amount);
        syncBillDue(acc);
      }
    } else if (t.type === "income") {
      acc = accById(t.accountId);
      if (acc && !isDueAcc(acc)) acc.balance = r2(acc.balance - t.amount);
    } else {
      var f = accById(t.fromId), g = accById(t.toId);
      if (f && !isDueAcc(f)) f.balance = r2(f.balance + t.amount);
      if (t.type === "repay") {
        if (g) {
          g.balance = r2(g.balance + t.amount);
          if (g.type === "loan") g.settled = null;
          syncBillDue(g);
        }
      }
      else if (g && !isDueAcc(g)) g.balance = r2(g.balance - t.amount);
    }
  }
  function applyTx(t) {
    var acc;
    if (t.type === "expense") {
      acc = accById(t.accountId);
      if (acc) {
        if (isDueAcc(acc)) acc.balance = r2(acc.balance + t.amount);
        else acc.balance = r2(acc.balance - t.amount);
        syncBillDue(acc);
      }
    } else if (t.type === "income") {
      acc = accById(t.accountId);
      if (acc && !isDueAcc(acc)) acc.balance = r2(acc.balance + t.amount);
    } else {
      var f = accById(t.fromId), g = accById(t.toId);
      if (f && !isDueAcc(f)) f.balance = r2(f.balance - t.amount);
      if (t.type === "repay") {
        if (g) {
          g.balance = r2(g.balance - t.amount);
          if (g.type === "loan" && g.balance <= 0) { g.balance = 0; g.settled = monthKey(new Date()); }
          syncBillDue(g);
        }
      }
      else if (g && !isDueAcc(g)) g.balance = r2(g.balance + t.amount);
    }
  }

  /* ---------------- render: transactions ---------------- */
  function renderTx() {
    var txs = state.tx.slice().sort(function (a, b) { return (b.ts || "").localeCompare(a.ts || ""); }).slice(0, 30);
    var thtml = "";
    if (!txs.length) thtml = '<div class="empty">暂无流水。</div>';
    txs.forEach(function (t) {
      var d = new Date(t.ts);
      var dateStr = (d.getMonth() + 1) + "-" + String(d.getDate()).padStart(2, "0") + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      var title, amountHtml, icon;
      if (t.type === "expense") {
        var c = catById(t.category);
        var acc = accById(t.accountId);
        title = esc(c.name) + (acc ? '<span class="note">' + esc(acc.name) + "</span>" : "");
        amountHtml = '<span class="amt out num">-' + fmt(t.amount) + "</span>";
        icon = c.icon;
      } else if (t.type === "income") {
        var acc2 = accById(t.accountId);
        title = "收入" + (acc2 ? '<span class="note">' + esc(acc2.name) + "</span>" : "");
        amountHtml = '<span class="amt in num">+' + fmt(t.amount) + "</span>";
        icon = "i-plus";
      } else if (t.type === "transfer") {
        var f = accById(t.fromId), g = accById(t.toId);
        title = "转账" + (f && g ? '<span class="note">' + esc(f.name) + " → " + esc(g.name) + "</span>" : "");
        amountHtml = '<span class="amt num" style="color:var(--kimi-color-text-secondary)">' + fmt(t.amount) + "</span>";
        icon = "i-swap";
      } else {
        var f2 = accById(t.fromId), g2 = accById(t.toId);
        title = "还款" + (f2 && g2 ? '<span class="note">' + esc(f2.name) + " → " + esc(g2.name) + "</span>" : "");
        amountHtml = '<span class="amt num" style="color:var(--kimi-color-text-secondary)">-' + fmt(t.amount) + "</span>";
        icon = "i-credit";
      }
      thtml += '<div class="row" data-tid="' + t.id + '">' +
        '<span class="ico">' + ico(icon) + "</span>" +
        '<div class="mid"><div class="tt">' + title + (t.note ? '<span class="note">' + esc(t.note) + "</span>" : "") + '</div><div class="dd">' + dateStr + "</div></div>" +
        amountHtml +
        '<button class="del" data-tdel="' + t.id + '" aria-label="删除">' + ico("i-close") + "</button>" +
        "</div>";
    });
    $("v-tx").innerHTML = thtml;
  }

  function render() {
    var now = new Date();
    $("v-month").textContent = now.getFullYear() + " 年 " + (now.getMonth() + 1) + " 月";
    renderBudget();
    renderDebts();
    renderAccounts();
    renderTx();
  }

  /* ---------------- modal / forms ---------------- */
  var mask = null, sheet = null;
  function openSheet(title, bodyHtml, onOk, okLabel, noFoot, extraFoot) {
    sheet.innerHTML =
      '<div class="sh"><span class="t">' + esc(title) + '</span><button class="x" id="m-x" aria-label="关闭">' + ico("i-close") + "</button></div>" +
      bodyHtml +
      (noFoot ? "" : '<div class="foot"><button class="kbtn ghost" id="m-cancel">取消</button>' + (extraFoot || "") + '<button class="kbtn pri" id="m-ok">' + esc(okLabel || "保存") + "</button></div>");
    mask.classList.add("open");
    $("m-x").onclick = closeSheet;
    if (!noFoot) {
      $("m-cancel").onclick = closeSheet;
      $("m-ok").onclick = function () {
        var r = onOk();
        if (r === false) return;
        if (typeof r === "string") { sheetErr(r); return; }
        closeSheet();
      };
      if (extraFoot && $("m-extra")) $("m-extra").onclick = function () {
        var r = onOk(true);
        if (r === false) return;
        if (typeof r === "string") { sheetErr(r); return; }
        closeSheet();
      };
    }
  }
  function closeSheet() { mask.classList.remove("open"); sheet.innerHTML = ""; }
  /* show an inline error inside the open sheet (onOk returns a message string) */
  function sheetErr(msg) {
    var foot = sheet.querySelector(".foot");
    var el = $("m-err");
    if (!el) {
      el = document.createElement("div");
      el.id = "m-err";
      if (foot) sheet.insertBefore(el, foot); else sheet.appendChild(el);
    }
    el.textContent = msg;
  }
  function fld(label, inner, hint) {
    return '<label class="fld"><span>' + esc(label) + "</span>" + inner + (hint ? '<span class="hint">' + esc(hint) + "</span>" : "") + "</label>";
  }
  function val(id) { var el = $(id); return el ? el.value.trim() : ""; }

  /* --- custom categories: chips + inline "new" input --- */
  function catChipsHtml(sel) {
    var html = state.cats.map(function (c) {
      return '<button type="button" data-cat="' + c.id + '"' + (c.id === sel ? ' class="on"' : "") + ">" + ico(c.icon) + esc(c.name) + "</button>";
    }).join("");
    html += '<button type="button" data-newcat>' + ico("i-plus") + "新建类别</button>";
    return html;
  }
  function bindCatChips(container, getSel, setSel) {
    container.addEventListener("click", function (e) {
      var nb = e.target.closest("[data-newcat]");
      if (nb) {
        container.innerHTML = '<span class="catnew"><input id="f-newcat" type="text" placeholder="输入类别名，回车创建" autocomplete="off"></span>';
        var inp = $("f-newcat");
        if (inp) inp.focus();
        var cancel = function () { container.innerHTML = catChipsHtml(getSel()); };
        var commit = function () {
          var name = inp ? inp.value.trim() : "";
          if (!name) { cancel(); return; }
          var cat = addCat(name);
          persist();
          setSel(cat.id);
          container.innerHTML = catChipsHtml(cat.id);
        };
        if (inp) {
          inp.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter") { ev.preventDefault(); commit(); }
            else if (ev.key === "Escape") { ev.preventDefault(); cancel(); }
          });
        }
        return;
      }
      var b = e.target.closest("[data-cat]");
      if (!b) return;
      setSel(b.getAttribute("data-cat"));
      container.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    });
  }

  /* --- category editor: rename / budget / delete --- */
  function catHasTx(catId) { return state.tx.some(function (t) { return t.category === catId; }); }
  function formCatBudget(catId) {
    var c = catById(catId);
    if (!c || c.id === "none") return;
    var cur = state.budgets[catId] || 0;
    var spent = (spendByCat())[catId] || 0;
    var hasTx = catHasTx(catId);
    openSheet("类别 · " + c.name,
      fld("类别名称", '<input id="f-cname" type="text" value="' + esc(c.name) + '">') +
      fld("每月预算金额", '<input id="f-amt" type="number" inputmode="decimal" min="0" step="100" value="' + (cur || "") + '" placeholder="留空 = 不设预算">',
        "本月" + c.name + "已花 " + fmt(spent) + (cur ? "，剩 " + fmt(cur - spent) : "")) +
      (hasTx ? "" : '<button type="button" class="kbtn danger sm" id="f-delcat">删除此类别</button>'),
      function (isClear) {
        if (isClear) { delete state.budgets[catId]; persist(); render(); return true; }
        var nm = val("f-cname");
        if (!nm) return false;
        c.name = nm;
        var v = parseFloat(val("f-amt"));
        if (isFinite(v) && v > 0) state.budgets[catId] = Math.round(v * 100) / 100;
        else delete state.budgets[catId];
        persist(); render(); return true;
      }, "保存", false,
      cur ? '<button class="kbtn danger" id="m-extra">清除预算</button>' : "");
    var del = $("f-delcat");
    if (del) del.onclick = function () {
      if (catHasTx(catId)) return;
      state.cats = state.cats.filter(function (x) { return x.id !== catId; });
      delete state.budgets[catId];
      persist(); render(); closeSheet();
    };
  }

  /* --- create a category (standalone, from the budget list) --- */
  function formAddCat() {
    openSheet("新建类别",
      fld("类别名称", '<input id="f-name" type="text" placeholder="如：餐饮、加油、宠物、健身……">') +
      fld("每月预算金额（可选）", '<input id="f-amt" type="number" inputmode="decimal" min="0" step="100" placeholder="留空 = 先不设预算">'),
      function () {
        var name = val("f-name");
        if (!name) return false;
        var cat = addCat(name);
        var v = parseFloat(val("f-amt"));
        if (isFinite(v) && v > 0) state.budgets[cat.id] = Math.round(v * 100) / 100;
        persist(); render(); return true;
      }, "创建");
  }

  /* --- account menu: click an asset card -> actions for that account --- */
  function formAccMenu(accId) {
    var acc = accById(accId);
    if (!acc) return;
    var rows =
      '<button type="button" data-m="exp">' + ico("i-minus") + "记支出</button>" +
      '<button type="button" data-m="inc">' + ico("i-plus") + "记收入</button>" +
      '<button type="button" data-m="bal">' + ico("i-save") + "记余额</button>";
    var hasTx = state.tx.some(function (t) { return t.accountId === accId || t.fromId === accId || t.toId === accId; });
    if (!hasTx) rows += '<button type="button" data-m="del" class="danger">' + ico("i-trash") + "删除此账户</button>";
    openSheet(acc.name,
      '<div class="amenu"><div class="balshow"><span class="l">当前余额</span><span class="v num">' + fmt(acc.balance) + "</span></div>" + rows + "</div>",
      null, null, true);
    sheet.querySelectorAll("[data-m]").forEach(function (b) {
      b.onclick = function () {
        var m = b.getAttribute("data-m");
        closeSheet();
        if (m === "exp") formExpense(accId);
        else if (m === "inc") formIncome(accId);
        else if (m === "bal") formBalance(accId);
        else if (m === "del") {
          state.accounts = state.accounts.filter(function (a) { return a.id !== accId; });
          persist(); render();
        }
      };
    });
  }

  /* --- manage all debts (including hidden loans, for self-correction) --- */
  function formDebtMgmt() {
    var now = new Date(), mk = monthKey(now);
    var debts = state.accounts.filter(isDueAcc);
    if (!debts.length) return;
    var rows = debts.map(function (a) {
      var isLoan = a.type === "loan", st;
      if (isLoan) {
        if (!a.dueDay) st = "定期扣款 · 未设还款日";
        else if (a.settled === mk) st = "本期已还 · 隐藏中 · 下期 " + a.dueDay + " 日";
        else st = "本期待还 " + fmt(Math.max(0, a.balance)) + " · 每期 " + fmt(a.amt || 0);
      } else {
        st = a.balance > 0 ? "未还 " + fmt(a.balance) + (a.limit ? " · 额度 " + fmt(a.limit) : "") : "已结清" + (a.limit ? " · 额度 " + fmt(a.limit) : "");
      }
      return '<button type="button" data-mid="' + a.id + '" style="text-align:left"><span style="flex:1;min-width:0"><span style="display:block">' +
        esc(a.name) + '</span><span style="display:block;font-size:12px;color:var(--kimi-color-text-tertiary)">' + esc(st) + "</span></span>" +
        ico("i-edit") + "</button>";
    }).join("");
    openSheet("管理负债", '<div class="amenu">' + rows + "</div>", null, null, true);
    sheet.querySelectorAll("[data-mid]").forEach(function (b) {
      b.onclick = function () { var id = b.getAttribute("data-mid"); closeSheet(); formDebtMenu(id); };
    });
  }

  /* --- debt menu --- */
  function formDebtMenu(accId) {
    var acc = accById(accId);
    if (!acc) return;
    var isLoan = acc.type === "loan";
    var settledNow = acc.settled === monthKey(new Date());
    var headSub = isLoan
      ? (acc.dueDay ? "每月 " + acc.dueDay + " 日扣款 · 每期 " + fmt(acc.amt || 0) : "未设还款日")
      : (acc.dueDay ? "DDL 每月 " + acc.dueDay + " 日" + (acc.limit ? " · 额度 " + fmt(acc.limit) : "") : "未设还款日");
    var rows = "";
    if (!isLoan) rows += '<button type="button" data-m="exp">' + ico("i-minus") + "记支出（刷卡）</button>";
    rows += '<button type="button" data-m="repay">' + ico("i-credit") + (isLoan ? "还本期" : "还款") + "</button>";
    if (isLoan) rows += '<button type="button" data-m="settle">' + ico("i-save") + (settledNow ? "撤销本期已还标记" : "标记本期已还") + "</button>";
    rows += '<button type="button" data-m="bal">' + ico("i-edit") + (isLoan ? "调整每期应还 / 还款日" : "调整未还金额 / 额度 / 还款日") + "</button>";
    var hasTx = state.tx.some(function (t) { return t.accountId === accId || t.fromId === accId || t.toId === accId; });
    if (!hasTx) rows += '<button type="button" data-m="del" class="danger">' + ico("i-trash") + "删除此负债</button>";
    openSheet(acc.name,
      '<div class="amenu"><div class="balshow"><span class="l">' + esc(headSub) + '</span><span class="v num">' + fmt(Math.max(0, acc.balance)) + "</span></div>" + rows + "</div>",
      null, null, true);
    sheet.querySelectorAll("[data-m]").forEach(function (b) {
      b.onclick = function () {
        var m = b.getAttribute("data-m");
        closeSheet();
        if (m === "exp") formExpense(accId);
        else if (m === "repay") formTransfer(true, accId);
        else if (m === "settle") {
          if (settledNow) { acc.settled = null; }
          else { acc.settled = monthKey(new Date()); acc.balance = 0; }
          persist(); render();
        }
        else if (m === "bal") formBalance(accId);
        else if (m === "del") {
          state.accounts = state.accounts.filter(function (a) { return a.id !== accId; });
          persist(); render();
        }
      };
    });
  }

  /* --- edit an existing transaction (balances auto reverted & re-applied) --- */
  function formEditTx(t) {
    if (!t) return;
    var delFoot = '<button class="kbtn danger" id="m-extra">删除这笔</button>';
    var doClear = function () {
      revertTx(t);
      state.tx = state.tx.filter(function (x) { return x.id !== t.id; });
      persist(); render(); return true;
    };
    if (t.type === "expense") {
      var pickedCat = t.category;
      var accOpts = state.accounts.filter(function (a) { return a.type !== "loan"; }).map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === t.accountId ? " selected" : "") + ">" + accOptLabel(a) + "</option>";
      }).join("");
      openSheet("修改支出",
        fld("金额", '<input id="f-amt" type="number" inputmode="decimal" min="0.01" step="0.01" value="' + t.amount + '">') +
        fld("分类", '<div class="chips" id="f-cats">' + catChipsHtml(pickedCat) + "</div>") +
        fld("支付账户", '<select id="f-acc">' + accOpts + "</select>") +
        fld("备注", '<input id="f-note" type="text" value="' + esc(t.note || "") + '" placeholder="买了什么">'),
        function (isClear) {
          if (isClear) return doClear();
          var amt = parseAmt(val("f-amt"));
          var acc = accById(val("f-acc"));
          if (!amt || !acc || !pickedCat) return false;
          revertTx(t);
          t.amount = amt; t.category = pickedCat; t.accountId = acc.id; t.note = val("f-note") || null;
          applyTx(t);
          persist(); render(); return true;
        }, "保存", false, delFoot);
      bindCatChips($("f-cats"), function () { return pickedCat; }, function (id) { pickedCat = id; });
      return;
    }
    if (t.type === "income") {
      var accOpts2 = state.accounts.filter(function (a) { return !isDueAcc(a); }).map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === t.accountId ? " selected" : "") + ">" + accOptLabel(a) + "</option>";
      }).join("");
      openSheet("修改收入",
        fld("金额", '<input id="f-amt" type="number" inputmode="decimal" min="0.01" step="0.01" value="' + t.amount + '">') +
        fld("存入账户", '<select id="f-acc">' + accOpts2 + "</select>") +
        fld("备注", '<input id="f-note" type="text" value="' + esc(t.note || "") + '" placeholder="工资 / 外快…">'),
        function (isClear) {
          if (isClear) return doClear();
          var amt = parseAmt(val("f-amt"));
          var acc = accById(val("f-acc"));
          if (!amt || !acc) return false;
          revertTx(t);
          t.amount = amt; t.accountId = acc.id; t.note = val("f-note") || null;
          applyTx(t);
          persist(); render(); return true;
        }, "保存", false, delFoot);
      return;
    }
    /* transfer / repay */
    var assetAccs = state.accounts.filter(function (a) { return !isDueAcc(a); });
    var toAccs = t.type === "repay" ? state.accounts.filter(isDueAcc) : assetAccs;
    openSheet(t.type === "repay" ? "修改还款" : "修改转账",
      fld("金额", '<input id="f-amt" type="number" inputmode="decimal" min="0.01" step="0.01" value="' + t.amount + '">') +
      fld("转出账户", '<select id="f-from">' + assetAccs.map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === t.fromId ? " selected" : "") + ">" + accOptLabel(a) + "</option>";
      }).join("") + "</select>") +
      fld(t.type === "repay" ? "还到" : "转入账户", '<select id="f-to">' + toAccs.map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === t.toId ? " selected" : "") + ">" + accOptLabel(a) + "</option>";
      }).join("") + "</select>"),
      function (isClear) {
        if (isClear) return doClear();
        var amt = parseAmt(val("f-amt"));
        var from = accById(val("f-from")), to = accById(val("f-to"));
        if (!amt) return "请填写正确的金额";
        if (!from || !to) return "账户选择无效，请重新选择";
        if (from.id === to.id) return "转出和转入不能是同一个账户";
        revertTx(t);
        if (!isDueAcc(from) && from.balance < amt) { applyTx(t); return "「" + from.name + "」余额不足（当前 " + fmt(from.balance) + "）"; }
        if (t.type === "repay" && to.balance <= 0) { applyTx(t); return "「" + to.name + "」当前没有待还金额"; }
        if (t.type === "repay" && amt > to.balance) { applyTx(t); return "还款金额不能超过待还 " + fmt(to.balance); }
        t.amount = amt; t.fromId = from.id; t.toId = to.id;
        applyTx(t);
        persist(); render(); return true;
      }, "保存", false, delFoot);
  }

  /* --- expense (account locked) --- */
  function formExpense(accId, prefillAmt) {
    var acc = accById(accId);
    if (!acc) return;
    var pickedCat = state.cats.length ? state.cats[0].id : null;
    openSheet("记支出 · " + acc.name,
      fld("金额", '<input id="f-amt" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" value="' + (prefillAmt || "") + '">') +
      fld("分类", '<div class="chips" id="f-cats">' + catChipsHtml(pickedCat) + "</div>" +
        (state.cats.length ? "" : '<span class="hint">还没有类别，点「新建类别」创建一个</span>')) +
      fld("支付账户", '<input value="' + esc(acc.name) + '" disabled>') +
      fld("备注（可选）", '<input id="f-note" type="text" placeholder="买了什么">'),
      function () {
        var amt = parseAmt(val("f-amt"));
        if (!amt || !pickedCat) return false;
        state.tx.push({ id: uid("t"), ts: nowISO(), type: "expense", amount: amt, accountId: acc.id, category: pickedCat, note: val("f-note") || null });
        if (isDueAcc(acc)) acc.balance = Math.round((acc.balance + amt) * 100) / 100;
        else acc.balance = Math.round((acc.balance - amt) * 100) / 100;
        syncBillDue(acc);
        persist(); render(); return true;
      }, "记上");
    bindCatChips($("f-cats"), function () { return pickedCat; }, function (id) { pickedCat = id; });
  }

  /* --- expense from a budget tile: category locked, pick the paying account --- */
  function formExpenseCat(catId) {
    var cat = catById(catId);
    if (!cat) return;
    var accs = state.accounts.filter(function (a) { return a.type !== "loan"; });
    if (!accs.length) return;
    /* default to the account used by the most recent expense, else the first */
    var def = accs[0].id;
    for (var i = state.tx.length - 1; i >= 0; i--) {
      var t0 = state.tx[i];
      if (t0.type === "expense" && accs.some(function (a) { return a.id === t0.accountId; })) { def = t0.accountId; break; }
    }
    openSheet("记支出 · " + cat.name,
      fld("金额", '<input id="f-amt" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00">') +
      fld("预算项目", '<button type="button" class="catlink" id="f-catset"><span>' + esc(cat.name) + '</span><span class="go">预算设置 ›</span></button>') +
      fld("支付账户", '<select id="f-acc">' + accs.map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === def ? " selected" : "") + ">" + accOptLabel(a) + "</option>";
      }).join("") + "</select>") +
      fld("备注（可选）", '<input id="f-note" type="text" placeholder="买了什么">'),
      function (isClear) {
        if (isClear) return true;
        var amt = parseAmt(val("f-amt"));
        var acc = accById(val("f-acc"));
        if (!amt) return "请填写正确的金额";
        if (!acc) return "请选择支付账户";
        state.tx.push({ id: uid("t"), ts: nowISO(), type: "expense", amount: amt, accountId: acc.id, category: cat.id, note: val("f-note") || null });
        if (isDueAcc(acc)) acc.balance = Math.round((acc.balance + amt) * 100) / 100;
        else acc.balance = Math.round((acc.balance - amt) * 100) / 100;
        syncBillDue(acc);
        persist(); render(); return true;
      }, "记上");
    var cs = $("f-catset");
    if (cs) cs.onclick = function () { closeSheet(); formCatBudget(catId); };
  }

  /* --- income (account locked) --- */
  function formIncome(accId) {
    var acc = accById(accId);
    if (!acc) return;
    openSheet("记收入 · " + acc.name,
      fld("金额", '<input id="f-amt" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00">') +
      fld("存入账户", '<input value="' + esc(acc.name) + '" disabled>') +
      fld("备注（可选）", '<input id="f-note" type="text" placeholder="工资 / 外快…">'),
      function () {
        var amt = parseAmt(val("f-amt"));
        if (!amt) return false;
        state.tx.push({ id: uid("t"), ts: nowISO(), type: "income", amount: amt, accountId: acc.id, note: val("f-note") || null });
        if (!isDueAcc(acc)) acc.balance = Math.round((acc.balance + amt) * 100) / 100;
        persist(); render(); return true;
      }, "记上");
  }

  /* --- transfer / repay --- */
  function formTransfer(isRepay, toId) {
    var assetAccs = state.accounts.filter(function (a) { return !isDueAcc(a); });
    var creditAccs = state.accounts.filter(isDueAcc);
    var body =
      fld("金额", '<input id="f-amt" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00">') +
      fld(isRepay ? "从哪个账户扣款" : "转出账户", '<select id="f-from">' + assetAccs.map(function (a) {
        return '<option value="' + a.id + '">' + accOptLabel(a) + "</option>";
      }).join("") + "</select>");
    if (isRepay) {
      body += fld("还到", '<select id="f-to">' + creditAccs.map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === toId ? " selected" : "") + ">" + accOptLabel(a) + "</option>";
      }).join("") + "</select>");
    } else {
      body += fld("转入账户", '<select id="f-to">' + assetAccs.map(function (a) {
        return '<option value="' + a.id + '">' + accOptLabel(a) + "</option>";
      }).join("") + "</select>");
    }
    openSheet(isRepay ? "还款" : "账户间转账", body, function () {
      var amt = parseAmt(val("f-amt"));
      var from = accById(val("f-from")), to = accById(val("f-to"));
      if (!amt) return "请填写正确的金额";
      if (!from || !to) return "账户选择无效，请重新选择";
      if (from.id === to.id) return "转出和转入不能是同一个账户";
      if (!isDueAcc(from) && from.balance < amt) return "「" + from.name + "」余额不足（当前 " + fmt(from.balance) + "），换个账户或先调整余额";
      if (isRepay && to.balance <= 0) return "「" + to.name + "」当前没有待还金额";
      if (isRepay && amt > to.balance) return "还款金额不能超过待还 " + fmt(to.balance);
      state.tx.push({ id: uid("t"), ts: nowISO(), type: isRepay ? "repay" : "transfer", amount: amt, fromId: from.id, toId: to.id });
      if (!isDueAcc(from)) from.balance = Math.round((from.balance - amt) * 100) / 100;
      if (isRepay) {
        to.balance = Math.round((to.balance - amt) * 100) / 100;
        if (to.type === "loan" && to.balance <= 0) { to.balance = 0; to.settled = monthKey(new Date()); }
        syncBillDue(to);
      }
      else if (!isDueAcc(to)) to.balance = Math.round((to.balance + amt) * 100) / 100;
      persist(); render(); return true;
    }, "确认");
  }

  /* --- adjust debt / balance --- */
  function formBalance(accId) {
    var acc = accById(accId);
    if (!acc) return;
    var isDue = isDueAcc(acc);
    var isLoan = acc.type === "loan";
    var body, onOk;
    if (isLoan) {
      body =
        fld("每期应还金额", '<input id="f-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="' + (acc.amt || "") + '">',
          "到还款日会自动带出此金额作为本期应还") +
        fld("每月还款日", '<input id="f-due" type="number" min="1" max="28" placeholder="如 15" value="' + (acc.dueDay || "") + '">');
      onOk = function () {
        var v = parseFloat(val("f-amt"));
        if (!isFinite(v) || v <= 0) return false;
        acc.amt = Math.round(v * 100) / 100;
        var dv = parseInt(val("f-due"), 10);
        acc.dueDay = dv >= 1 && dv <= 28 ? dv : (dv ? acc.dueDay : null);
        persist(); render(); return true;
      };
    } else {
      body =
        fld("当前" + (isDue ? "未还金额" : "余额"), '<input id="f-bal" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="' + acc.balance + '">',
          (isDue ? "对账用：和账单不一致时手动改" : "上次记录：" + fmt(acc.last != null ? acc.last : acc.balance))) +
        (isDue ? fld("信用额度", '<input id="f-limit" type="number" inputmode="decimal" min="0" step="100" placeholder="0" value="' + (acc.limit || "") + '">') : "") +
        (isDue ? fld("每月还款日（DDL）", '<input id="f-due" type="number" min="1" max="28" placeholder="如 2" value="' + (acc.dueDay || "") + '">') : "");
      onOk = function () {
        var v = parseFloat(val("f-bal"));
        if (!isFinite(v) || v < 0) return false;
        acc.last = acc.balance;
        acc.balance = Math.round(v * 100) / 100;
        if (isDue) {
          var lv = parseFloat(val("f-limit"));
          if (isFinite(lv) && lv > 0) acc.limit = Math.round(lv * 100) / 100;
          var dv = parseInt(val("f-due"), 10);
          acc.dueDay = dv >= 1 && dv <= 28 ? dv : (dv ? acc.dueDay : null);
        }
        syncBillDue(acc);
        persist(); render(); return true;
      };
    }
    openSheet((isDue ? "调整负债 · " : "记余额 · ") + acc.name, body, onOk, "保存");
  }

  /* --- add debt (from the repayment-bar section) --- */
  function formAddDebt() {
    openSheet("添加负债",
      fld("名称", '<input id="f-name" type="text" placeholder="如：花呗、京东白条、车贷……">') +
      fld("资金类型", '<select id="f-type">' +
        '<option value="credit">循环信用（信用卡：持续消费累积，随时还款）</option>' +
        '<option value="loan">定期扣款（每期固定金额，还款日一笔扣）</option></select>') +
      '<div id="fw-loan" style="display:none">' +
        fld("每期应还金额", '<input id="f-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">') +
      "</div>" +
      '<div id="fw-credit">' +
        fld("当前未还金额", '<input id="f-bal" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">') +
        fld("信用额度", '<input id="f-limit" type="number" inputmode="decimal" min="0" step="100" placeholder="如 7500">') +
      "</div>" +
      fld("每月还款日", '<input id="f-due" type="number" min="1" max="28" placeholder="定期扣款填扣款日，信用卡填 DDL">'),
      function () {
        var name = val("f-name");
        if (!name) return false;
        var type = val("f-type");
        var dv = parseInt(val("f-due"), 10);
        var acc = { id: uid("a"), name: name, type: type, balance: 0, last: null };
        if (dv >= 1 && dv <= 28) acc.dueDay = dv;
        if (type === "loan") {
          var amt = parseFloat(val("f-amt"));
          if (!isFinite(amt) || amt <= 0) return false;
          acc.amt = Math.round(amt * 100) / 100;
          acc.balance = acc.amt;
        } else {
          var v = parseFloat(val("f-bal"));
          if (!isFinite(v) || v < 0) return false;
          acc.balance = Math.round(v * 100) / 100;
          var lv = parseFloat(val("f-limit"));
          if (isFinite(lv) && lv > 0) acc.limit = Math.round(lv * 100) / 100;
        }
        state.accounts.push(acc);
        persist(); render(); return true;
      }, "添加");
    var ts = $("f-type");
    if (ts) ts.onchange = function () {
      var isL = this.value === "loan";
      $("fw-loan").style.display = isL ? "" : "none";
      $("fw-credit").style.display = isL ? "none" : "";
    };
  }

  /* --- add account --- */
  function formAddAcc() {
    openSheet("添加账户",
      fld("账户名称", '<input id="f-name" type="text" placeholder="如：招行储蓄卡">') +
      fld("类型", '<select id="f-type">' +
        '<option value="debit">储蓄卡</option><option value="cash">现金</option>' +
        '<option value="credit">信用卡</option><option value="loan">信用贷 / 借款</option></select>') +
      fld("当前金额", '<input id="f-bal" type="number" inputmode="decimal" step="0.01" placeholder="0.00">',
        "信用卡 / 信用贷填当前待还金额，会显示为还款条") +
      fld("每月还款日（可选）", '<input id="f-due" type="number" min="1" max="28" placeholder="仅信用卡 / 信用贷">'),
      function () {
        var name = val("f-name");
        var v = parseFloat(val("f-bal"));
        if (!name || !isFinite(v) || v < 0) return false;
        var type = val("f-type");
        var acc = { id: uid("a"), name: name, type: type, balance: Math.round(v * 100) / 100, last: null };
        var dv = parseInt(val("f-due"), 10);
        if (isDueAcc(acc) && dv >= 1 && dv <= 28) acc.dueDay = dv;
        state.accounts.push(acc);
        persist(); render(); return true;
      }, "添加");
  }

  /* ---------------- events ---------------- */
  function bind() {
    $("b-trf").onclick = function () { formTransfer(false); };
    $("b-debtmgmt").onclick = function () { formDebtMgmt(); };
    $("v-blist").addEventListener("click", function (e) {
      var add = e.target.closest("#b-addcat");
      if (add) { formAddCat(); return; }
      var row = e.target.closest("[data-bcat]");
      if (!row) return;
      var catId = row.getAttribute("data-bcat");
      if (row.classList.contains("needb")) formCatBudget(catId);
      else formExpenseCat(catId);
    });
    $("v-blist").addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var row = e.target.closest && e.target.closest("[data-bcat]");
      if (!row) return;
      e.preventDefault();
      if (row.classList.contains("needb")) formCatBudget(row.getAttribute("data-bcat"));
      else formExpenseCat(row.getAttribute("data-bcat"));
    });
    $("v-debts").addEventListener("click", function (e) {
      var addD = e.target.closest("#b-adddebt");
      if (addD) { formAddDebt(); return; }
      var row = e.target.closest("[data-debt]");
      if (row) formDebtMenu(row.getAttribute("data-debt"));
    });
    $("v-debts").addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var row = e.target.closest && e.target.closest("[data-debt]");
      if (row) { e.preventDefault(); formDebtMenu(row.getAttribute("data-debt")); }
    });
    $("v-accs").addEventListener("click", function (e) {
      var add = e.target.closest("#b-addacc");
      if (add) { formAddAcc(); return; }
      var btn = e.target.closest("[data-act]");
      if (btn) {
        var id = btn.getAttribute("data-id");
        var act = btn.getAttribute("data-act");
        if (act === "bal") formBalance(id);
        else if (act === "del") {
          if (state.tx.some(function (t) { return t.accountId === id || t.fromId === id || t.toId === id; })) return;
          state.accounts = state.accounts.filter(function (a) { return a.id !== id; });
          persist(); render();
        }
        return;
      }
      var card = e.target.closest("[data-aid]");
      if (card) formAccMenu(card.getAttribute("data-aid"));
    });
    $("v-accs").addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var card = e.target.closest && e.target.closest("[data-aid]");
      if (card) { e.preventDefault(); formAccMenu(card.getAttribute("data-aid")); }
    });
    $("v-tx").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-tdel]");
      if (btn) {
        var id = btn.getAttribute("data-tdel");
        var t0 = null;
        for (var i = 0; i < state.tx.length; i++) if (state.tx[i].id === id) t0 = state.tx[i];
        if (!t0) return;
        revertTx(t0);
        state.tx = state.tx.filter(function (x) { return x.id !== id; });
        persist(); render();
        return;
      }
      var row = e.target.closest("[data-tid]");
      if (!row) return;
      var tid = row.getAttribute("data-tid"), tx = null;
      for (var j = 0; j < state.tx.length; j++) if (state.tx[j].id === tid) tx = state.tx[j];
      formEditTx(tx);
    });
    mask.addEventListener("click", function (e) { if (e.target === mask) closeSheet(); });
  }

  /* ---------------- boot ---------------- */
  function boot() {
    mask = $("v-mask"); sheet = $("v-sheet");
    bind();
    load(function () { render(); });
  }
  try {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { try { boot(); } catch (e) {} });
    else boot();
  } catch (e) {}
})();
</script>
</template>
<template id="tpl-sch">
<style>
  html,body{margin:0;padding:0;font-family:var(--kimi-font-sans);}
  button,input,select,textarea{font:inherit;}
  .wrap{padding:var(--kimi-space-4);display:flex;flex-direction:column;gap:var(--kimi-space-4);}
  .legend{display:flex;flex-wrap:wrap;gap:var(--kimi-space-3);font-size:12px;color:var(--kimi-color-text-secondary);}
  .legend span{display:inline-flex;align-items:center;gap:var(--kimi-space-1);}
  .dot{width:8px;height:8px;border-radius:var(--kimi-radius-full);display:inline-block;}
  .d-work{background:var(--kimi-chart-1);}.d-side{background:var(--kimi-chart-4);}
  .d-fit{background:var(--kimi-chart-3);}.d-life{background:var(--kimi-color-text-quaternary);}
  .d-mixed{background:var(--kimi-chart-2);}
  .tl-row{display:grid;grid-template-columns:92px 1fr;gap:var(--kimi-space-3);padding:var(--kimi-space-2) 0;border-bottom:1px solid var(--kimi-color-border);align-items:start;}
  .tl-row:last-child{border-bottom:none;}
  .tl-time{font-size:12px;color:var(--kimi-color-text-tertiary);font-variant-numeric:tabular-nums;padding-top:2px;}
  .tl-block{border-radius:var(--kimi-radius-chip);padding:var(--kimi-space-2) var(--kimi-space-3);}
  .tl-block b{font-weight:500;font-size:14px;display:block;}
  .tl-block small{font-size:12px;color:var(--kimi-color-text-secondary);display:block;margin-top:2px;}
  .b-work{background:color-mix(in srgb,var(--kimi-chart-1) 12%,transparent);}
  .b-side{background:color-mix(in srgb,var(--kimi-chart-4) 12%,transparent);}
  .b-fit{background:color-mix(in srgb,var(--kimi-chart-3) 12%,transparent);}
  .b-life{background:color-mix(in srgb,var(--kimi-color-text-quaternary) 12%,transparent);}
  .b-mixed{background:color-mix(in srgb,var(--kimi-chart-2) 10%,transparent);}
  .wk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--kimi-space-2);}
  .wk-day{border:1px solid var(--kimi-color-border);border-radius:var(--kimi-radius-input);padding:var(--kimi-space-3);}
  .wk-day h4{margin:0 0 var(--kimi-space-2);font-size:14px;font-weight:500;}
  .wk-day .tt{font-size:13px;font-weight:500;}

<script>
(function(){
  var host = {};
  var CHECKS = ['lunch','dinner','window','ellip','walk','core','strength','weigh'];
  var DEF_LUNCH = {1:'A1',2:'A89',3:'A39',4:'A49',5:'A64',6:'A19',0:'free'};
  var DEF_DINNER = {1:'B49',2:'B61',3:'B17',4:'B29',5:'B7',6:'B42',0:'B51'};

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  var today = todayKey();
  var dow = new Date().getDay();

  var state = { date: today, checks: {}, meals: {}, weights: {} };
  try {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem("cup-checkin-v1") || "null"); } catch (e) {}
    if (saved && typeof saved === 'object') {
      if (saved.weights) state.weights = saved.weights;
      if (saved.date === today) {
        state.checks = saved.checks || {};
        state.meals = saved.meals || {};
      }
    }
  } catch(e){}

  function renderDetail(selId, boxId){
    var v = document.getElementById(selId).value;
    var box = document.getElementById(boxId);
    var m = MEALS[v];
    if (!m) { box.classList.remove('show'); box.innerHTML = ''; return; }
    var html = '<b>采购清单</b>：' + m.b;
    if (m.p) html += '<br><b>分量提醒</b>：' + m.p;
    box.innerHTML = html;
    box.classList.add('show');
  }

  function initMeal(id, defVal, boxId){
    var sel = document.getElementById(id);
    var savedVal = state.meals[id];
    if (savedVal !== undefined && sel.querySelector('option[value="' + savedVal + '"]')) {
      sel.value = savedVal;
    } else {
      sel.value = defVal;
    }
    state.meals[id] = sel.value;
    renderDetail(id, boxId);
  }
  initMeal('s-lunch', DEF_LUNCH[dow], 'd-lunch');
  initMeal('s-dinner', DEF_DINNER[dow], 'd-dinner');

  if (dow === 2 || dow === 4 || dow === 6) {
    document.getElementById('task-strength').classList.remove('hidden');
  }
  if (dow === 1) {
    document.getElementById('sec-weigh').classList.remove('hidden');
  }

  var dates = Object.keys(state.weights).sort();
  if (dates.length) {
    var last = dates[dates.length-1];
    document.getElementById('w-hist').textContent = '上次 ' + last.slice(5) + '：' + state.weights[last] + ' kg';
  }
  if (state.weights[today]) document.getElementById('w-input').value = state.weights[today];

  document.getElementById('dateLabel').textContent = today + ' · 周' + '日一二三四五六'[dow];

  function visibleChecks(){
    return CHECKS.filter(function(k){
      if (k === 'strength') return (dow === 2 || dow === 4 || dow === 6);
      if (k === 'weigh') return dow === 1;
      return true;
    });
  }

  function refresh(){
    var vis = visibleChecks(), done = 0;
    vis.forEach(function(k){
      var el = document.querySelector('.task[data-k="' + k + '"]');
      var cb = document.getElementById('c-' + k);
      var on = !!state.checks[k];
      cb.checked = on;
      el.classList.toggle('done', on);
      if (on) done++;
    });
    document.getElementById('progFill').style.width = (vis.length ? done / vis.length * 100 : 0) + '%';
    document.getElementById('progNum').textContent = done + ' / ' + vis.length;
    document.getElementById('doneBanner').classList.toggle('show', done === vis.length && vis.length > 0);
  }

  function persist(){
    try { localStorage.setItem("cup-checkin-v1", JSON.stringify(state)); } catch (e) {}
  }

  CHECKS.forEach(function(k){
    var cb = document.getElementById('c-' + k);
    if (!cb) return;
    cb.addEventListener('change', function(){
      state.checks[k] = cb.checked;
      refresh(); persist();
    });
  });
  document.getElementById('s-lunch').addEventListener('change', function(){
    state.meals['s-lunch'] = this.value; persist(); renderDetail('s-lunch','d-lunch');
  });
  document.getElementById('s-dinner').addEventListener('change', function(){
    state.meals['s-dinner'] = this.value; persist(); renderDetail('s-dinner','d-dinner');
  });
  document.getElementById('w-input').addEventListener('change', function(){
    var v = parseFloat(this.value);
    if (!isNaN(v) && v > 30 && v < 150) {
      state.weights[today] = v;
      document.getElementById('w-hist').textContent = '已记录 ' + v + ' kg';
      state.checks.weigh = true;
      persist(); refresh();
    }
  });

  refresh();
})();
</script>
</template>

    tabs.forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    ['fin', 'sch', 'chk'].forEach(function (k) {
      document.getElementById('if-' + k).classList.toggle('on', k === name);
    });
    try { localStorage.setItem(KEY, name); } catch (e) {}
  }
  tabs.forEach(function (b) { b.addEventListener('click', function () { activate(b.dataset.tab); }); });
  var last = null;
  try { last = localStorage.getItem(KEY); } catch (e) {}
  activate(['fin', 'sch', 'chk'].indexOf(last) >= 0 ? last : 'fin');
})();
</script>
</body>
</html>
